<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding Client - BankFR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .customer-info {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .tab-button {
            flex: 1;
            padding: 20px;
            background: none;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #6c757d;
        }

        .tab-button.active {
            background: white;
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
        }

        .tab-button:hover {
            background: #e9ecef;
        }

        .tab-content {
            display: none;
            padding: 40px;
        }

        .tab-content.active {
            display: block;
        }

        .form-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-row.full-width {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .required {
            color: #dc3545;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .currency-input {
            position: relative;
        }

        .currency-input input {
            padding-left: 35px;
        }

        .currency-symbol {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-weight: bold;
        }

        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #e9ecef;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }


        

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .tab-button {
                padding: 15px 10px;
                font-size: 1rem;
            }

            .tab-content {
                padding: 20px;
            }

            .button-container {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 480px) {
            .language-selector {
                top: 8px;
                right: 8px;
            }

            .lang-toggle-btn {
                padding: 4px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <header style="display: flex; align-items: center; gap: 15px;">
    <img src="logos/partners_01.png" alt="Company Logo"" />
  </header>
    <div class="container">
        <div class="header">
            <h1>Fiche de Connaissance Client</h1>
            <p>Personne Physique - BankFR</p>
            <div class="customer-info" id="customerInfo">
                <strong>Client ID:</strong> <span id="customerId">Chargement...</span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('identification')">Identification Client</button>
            <button class="tab-button" onclick="showTab('financial')">Informations Financières</button>
        </div>

        <form id="onboardingForm">
            <!-- Identification Tab -->
            <div id="identification" class="tab-content active">
                <div class="form-section">
                    <h2 class="section-title">
                        👤 Identification du Client
                    </h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prenom">Prénom <span class="required">*</span></label>
                            <input type="text" id="prenom" name="prenom" required>
                        </div>
                        <div class="form-group">
                            <label for="nom">Nom <span class="required">*</span></label>
                            <input type="text" id="nom" name="nom" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dateNaissance">Date de naissance <span class="required">*</span></label>
                            <input type="date" id="dateNaissance" name="dateNaissance" required>
                        </div>
                        <div class="form-group">
                            <label for="Nationalite">Nationalité <span class="required">*</span></label>
                            <select id="Nationalite" name="Nationalite" required>
                                <!-- Options will be populated by JavaScript -->
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="etatCivil">État civil </label>
                            <select id="etatCivil" name="etatCivil">
                                <option value="">-- Sélectionner --</option>
                                <option value="celibataire">Célibataire</option>
                                <option value="marie">Marié(e)</option>
                                <option value="divorce">Divorcé(e)</option>
                                <option value="veuf">Veuf/Veuve</option>
                                <option value="pacs">PACS</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="portable">Portable </label>
                            <input type="tel" id="portable" name="portable">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="telephone">Téléphone</label>
                            <input type="tel" id="telephone" name="telephone">
                        </div>
                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" >
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="section-title">
                        🏠 Adresse de Résidence
                    </h2>
                    
                    <div class="form-row full-width">
                        <div class="form-group">
                            <label for="adresse">Adresse de résidence </label>
                            <textarea id="adresse" name="adresse"  placeholder="Adresse complète"></textarea>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="codePostal">Code postal</label>
                            <input type="text" id="codePostal" name="codePostal">
                        </div>
                        <div class="form-group">
                            <label for="ville">Ville </label>
                            <input type="text" id="ville" name="ville">
                        </div>
                    </div>

                    <div class="form-row full-width">
                        <div class="form-group">
                     <label for="PaysDeResidence">Pays de Résidence <span class="required">*</span></label>
                            <select id="PaysDeResidence" name="PaysDeResidence" required>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="section-title">
                        📄 Pièce d'identité
                    </h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="typePiece">Type de la pièce d'identité <span class="required">*</span></label>
                            <select id="typePiece" name="typePiece" required>
                                <option value="">-- Sélectionner --</option>
                                <option value="cin">Carte d'identité nationale</option>
                                <option value="passeport">Passeport</option>
                                <option value="titre_sejour">Titre de séjour</option>
                                <option value="permis_conduire">Permis de conduire</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="numeroPiece">Numéro de la pièce d'identité <span class="required">*</span></label>
                            <input type="text" id="numeroPiece" name="numeroPiece" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dateDelivrance">Date de délivrance</label>
                            <input type="date" id="dateDelivrance" name="dateDelivrance">
                        </div>
                        <div class="form-group">
                            <label for="dateExpiration">Date d'expiration</label>
                            <input type="date" id="dateExpiration" name="dateExpiration">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Financial Information Tab -->
            <div id="financial" class="tab-content">
                <div class="form-section">
                    <h2 class="section-title">
                        💰 Informations Financières
                    </h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="profession">Profession <span class="required">*</span></label>
                            <select id="profession" name="profession" required>
                                <option value="">-- Sélectionner --</option>
                                <option value="CLERGE & RELIGIEUX">CLERGE & RELIGIEUX</option>
                                <option value="COMMERCANTS">COMMERCANTS</option>
                                <option value="COMM.ARTISAN N.CLASS">COMM.ARTISAN N.CLASS</option>
                                <option value="PROF LIB.CABINET GR.">PROF LIB.CABINET GR.</option>
                                <option value="PROF.SCIENTIFIQUES">PROF.SCIENTIFIQUES</option>
                                <option value="INGENIEURS& ASSIM.">INGENIEURS& ASSIM.</option>
                                <option value="AUT CAD SUP SEC PRIV">AUT CAD SUP SEC PRIV</option>
                                <option value="AUT CAD SUP SEC PUBL">AUT CAD SUP SEC PUBL</option>
                                <option value="DIRECTEUR DE SOCIETE">DIRECTEUR DE SOCIETE</option>
                                <option value="AUT.PERS.DIRIG.SOCIE">AUT.PERS.DIRIG.SOCIE</option>
                                <option value="0100">CHOMEURS</option>
                                <option value="0101">ARCHITECTES SALARIES</option>
                                <option value="NOTAIRE">NOTAIRE</option>
                                <option value="INCONNU">INCONNU</option>
                                <option value="AGRICULTEUR EXPLOIT.">AGRICULTEUR EXPLOIT.</option>
                                <option value="SALARIES AGRICOLES">SALARIES AGRICOLES</option>
                                <option value="AGRICULTEURS N.CLASS">AGRICULTEURS N.CLASS</option>
                                <option value="ELEVEUR">ELEVEUR</option>
                                <option value="INDUSTRIELS">INDUSTRIELS</option>
                                <option value="ARTISANS">ARTISANS</option>
                                <option value="PATRONS PECHEURS">PATRONS PECHEURS</option>
                                <option value="GROS COM.& CHEF ENT.">GROS COM.& CHEF ENT.</option>
                                <option value="PETITS COMMERCANTS">PETITS COMMERCANTS</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="canal">Canal de distribution <span class="required">*</span></label>
                            <select id="canal" name="canal" required>
                                <option value="">-- Sélectionner --</option>
                                <option value="online">En ligne</option>
                                <option value="inagency">En personne (vente directe)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="produits">Produits/Services cibles <span class="required">*</span></label>
                            <select id="produits" name="produits" required>
                                <option value="">-- Sélectionner --</option>
                                <option value="currentAccount">Compte Courant</option>
                                <option value="savingAccount">Compte d'Épargne</option>
                                <option value="timeDeposit">Dépôt à Terme</option>
                                <option value="debitCard">Carte de Débit</option>
                                <option value="internetBanking">Internet Banking</option>
                                <option value="remittances">Transferts d'Argent</option>
                                <option value="mobileBanking">Mobile Banking</option>
                                <option value="creditCard">Carte de Crédit</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="revenu">Revenu annuel net (EUR)</label>
                            <div class="currency-input">
                                <span class="currency-symbol">€</span>
                                <input type="number" id="revenu" name="revenu"  min="0" step="1000" placeholder="0">
                            </div>
                        </div>
                    </div>

                    <div class="form-row full-width">
                        <div class="form-group">
                            <label for="origineFonds">Origine des fonds <span class="required">*</span></label>
                            <select id="origineFonds" name="origineFonds" required>
                                <option value="">-- Sélectionner --</option>
                                <option value="employmentIncome">Revenus d'Emploi</option>
                                <option value="businessProfits">Bénéfices d'Entreprise</option>
                                <option value="inheritance">Héritage</option>
                                <option value="retirementPension">Pension de Retraite</option>
                                <option value="investmentReturns">Rendements d'Investissement</option>
                                <option value="other">Autres (veuillez préciser)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="button-container">
                <button type="button" class="btn btn-secondary" onclick="goBack()">Retour</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">Finaliser l'Onboarding</button>
            </div>
        </form>
    </div>

    <!-- Include the shared JavaScript module -->
    <script src="onboarding_banque_en_PP.js"></script>

        // Function to populate select elements with countries
        function populateCountriesSelect(selectId, countries, defaultText = "-- Sélectionner --") {
            const selectElement = document.getElementById(selectId);
            if (!selectElement) {
                console.warn(`Select element with ID '${selectId}' not found`);
                return;
            }
            
            // Clear existing options except the default
            selectElement.innerHTML = `<option value="">${defaultText}</option>`;
            
            // Add all countries
            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                option.textContent = country;
                selectElement.appendChild(option);
            });
        }

        // Function to initialize all country dropdowns
        function initializeCountryDropdowns() {
            // For French forms (bankfr)
            populateCountriesSelect('Nationalite', countriesFrench);
            populateCountriesSelect('PaysDeResidence', countriesFrench);
        }

        // Call this function when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeCountryDropdowns();
            
            // Your existing onboarding handler initialization
            OnboardingHandler.init('onboardingForm', 'bankfr'); // or 'banque_en'
        });

    <script>
        // Tab switching functionality
        function showTab(tabName) {
            // Hide all tab contents
            const tabContents = document.querySelectorAll('.tab-content');
            tabContents.forEach(content => content.classList.remove('active'));

            // Remove active class from all tab buttons
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => button.classList.remove('active'));

            // Show selected tab content
            document.getElementById(tabName).classList.add('active');

            // Add active class to clicked button
            event.target.classList.add('active');
        }

        // Go back function
        function goBack() {
            if (confirm('Êtes-vous sûr de vouloir retourner? Les données non sauvegardées seront perdues.')) {
                window.location.href = 'index.html';
            }
        }


    </script>
</body>
</html>
